<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Calestia Travel &amp; Tours</title>
  <meta name="description" content="Set a new password for your Calestia Travel & Tours account." />
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="assets/images/calestia-logo.png" />
</head>
<body>

  <nav id="navbar">
    <a href="index.html" class="nav-logo">
      <img src="assets/images/calestia-logo.png" alt="Calestia logo" class="logo-icon" />
      <span>Calestia Travel &amp; Tours</span>
    </a>
  </nav>

  <main class="reset-wrap">
    <div class="reset-card">
      <div class="auth-brand">
        <img src="assets/images/calestia-logo.png" alt="" class="auth-logo" />
        <span>Calestia Travel &amp; Tours</span>
      </div>

      <h2 class="auth-title">Reset your password</h2>
      <p class="auth-sub" id="resetPasswordNotice">
        Open this page from the reset-password link in your email to continue.
      </p>

      <form id="resetPasswordForm" novalidate>
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required />
        </div>
        <div class="form-group">
          <label for="confirmNewPassword">Confirm New Password</label>
          <input type="password" id="confirmNewPassword" placeholder="Re-enter your new password" autocomplete="new-password" minlength="8" required />
        </div>
        <button type="submit" class="auth-submit">Update Password</button>
      </form>
    </div>
  </main>

  <footer>
    <div class="footer-bottom">
      <p>© 2026 Calestia Travel &amp; Tours. All rights reserved.</p>
    </div>
  </footer>

  <!-- ==================== TOAST ==================== -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Supabase SDK (auth) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <!-- Supabase project config (URL + public anon key) -->
  <script src="config.js"></script>

  <!-- App logic -->
  <script src="script.js"></script>
</body>
</html>
