<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting… — Calestia Travel &amp; Tours</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="assets/images/calestia-logo.png" />
</head>
<body>
  <!-- ==========================================================================
       staff-portal.html has been split into employee-portal.html and
       admin-portal.html (each with its own tailored sidebar/dashboard,
       sharing the Client Detail Modal and gate logic via staff-shared.js).
       This page only exists so old bookmarks/links don't 404 — it looks up
       the signed-in account's real role and forwards immediately.
       ========================================================================== -->
  <p style="font-family:sans-serif;text-align:center;margin-top:20vh;color:#335686;">Redirecting to your portal…</p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script>
    (function () {
      if (typeof window.supabase === 'undefined' || !window.CALESTIA_SUPABASE_URL) {
        window.location.href = 'index.html';
        return;
      }
      var supabaseClient = window.supabase.createClient(window.CALESTIA_SUPABASE_URL, window.CALESTIA_SUPABASE_ANON_KEY);
      var urls = window.CALESTIA_ROLE_PORTAL_URLS || {};

      supabaseClient.auth.getSession().then(function (result) {
        var session = result.data && result.data.session;
        if (!session) { window.location.href = 'index.html'; return; }

        supabaseClient.from('profiles').select('role').eq('id', session.user.id).maybeSingle().then(function (profileResult) {
          var role = profileResult.data && profileResult.data.role;
          window.location.href = urls[role] || 'client-portal.html';
        }).catch(function () { window.location.href = 'index.html'; });
      }).catch(function () { window.location.href = 'index.html'; });
    })();
  </script>
</body>
</html>
